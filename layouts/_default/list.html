{{ define "main" }}
<section class="list-page">
  <div class="container">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      <p>{{ .Description }}</p>
    </header>
    
    <div class="list-grid">
      {{ range .Pages }}
      {{ partial "review-card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
