<!-- AdSense Ad Slot: {{ .Position }} -->
{{- if site.Params.adsense_id }}
<div class="ad-container {{ .Class }}">
  <div class="ad-label">Advertisement</div>
  <ins class="adsbygoogle"
       data-ad-client="pub-{{ site.Params.adsense_id }}"
       data-ad-slot="{{ .AdSlot }}"
       data-ad-format="{{ if .AdFormat }}{{ .AdFormat }}{{ else }}auto{{ end }}"
       data-full-width-responsive="true"
       style="display:block;">
  </ins>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>
{{- end }}
